<h1 id="h1">OpenFIDS - Flight Information Display System</h1>
<img src="banners/open-fids-banner-without.webp" alt="OpenFIDS - Flight Information Display System" id="banner" loading="eager">
<form id="search-bar" [class.active]="airports().length > 0" (submit)="$event.preventDefault()">
  <svg id="search-svg"><use href="svgs/sprite.svg#aircraft"></use></svg>
  <input type="text" id="search-input" name="search" autocomplete="off" [formControl]="searchControl" placeholder="Search a commercial airport">
  <button type="submit" id="search-button">
    <svg id="search-button-svg"><use href="svgs/sprite.svg#search"></use></svg>
    <span id="search-button-span">Search</span>
  </button>
</form>
<app-airports-list [airports]="airports()" [class.active]="airports().length > 0"></app-airports-list>

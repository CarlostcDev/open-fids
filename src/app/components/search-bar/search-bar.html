<h1 id="h1">OpenFIDS - Flight Information Display System</h1>
<img [src]="'open-fids-banner-without' | assetPath:'banners'" alt="OpenFIDS" id="banner" loading="eager" fetchpriority="high" width="1200" height="344">

@let activeResults = results();
@let hasResults = activeResults.length > 0;

<form id="search-bar" role="search" [class.active]="hasResults" (submit)="$event.preventDefault()">
  <svg id="search-svg" aria-hidden="true" focusable="false"><use [attr.href]="'aircraft' | sprite"></use></svg>
  <label for="search-input" class="cdk-visually-hidden">Search commercial airport</label>
  <input #searchInput type="search" id="search-input" name="search" autocomplete="off" role="combobox" aria-haspopup="listbox"
         [value]="query()" (input)="query.set(searchInput.value)" (focus)="setFocus(true)" (blur)="setFocus(false)" placeholder="Search a commercial airport"
         aria-autocomplete="list" [attr.aria-expanded]="hasResults">
  <button type="submit" id="search-button" aria-label="Search airport">
    <svg id="search-button-svg" aria-hidden="true" focusable="false"><use [attr.href]="'search' | sprite"></use></svg>
    <span id="search-button-span" aria-hidden="true">Search</span>
  </button>
</form>

@if (hasResults) {
  @defer (on immediate) {
    <app-airports-list [airports]="activeResults" class="active"></app-airports-list>
  }
}

<footer id="footer">
  <nav class="footer-navigator">
    <ul class="footer-list">
      <li><a class="link github" href="https://github.com/CarlostcDev/open-fids" rel="noopener noreferrer" target="_blank">GitHub</a></li>
      <li><span class="separator">•</span></li>
      <li><a class="link data-sources" routerLink="/data-sources">Data Sources</a></li>
      <li><span class="separator">•</span></li>
      <li><a class="link privacy-policy" routerLink="/privacy-policy">Privacy Policy</a></li>
    </ul>
  </nav>
</footer>

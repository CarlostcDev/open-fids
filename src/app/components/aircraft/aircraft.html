<div class="aircraft-container" aria-live="polite">
  <img [src]="'aircrafts/' + aircraft[currentAircraft()].standard + '.webp'"
       [alt]="aircraft[currentAircraft()].name"
       [class]="aircraft[currentAircraft()].standard"
       id="aircraft" loading="eager" width="250" height="200"
       (animationiteration)="nextAircraft()">
</div>
